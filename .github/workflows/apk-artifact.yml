name: Android APK Release

concurrency:
  group: android-apk-release
  # Never interrupt an asset upload/tag move halfway through publication.
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install stable Android SDK 36
        run: sdkmanager --channel=1 "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Guard against a blank launcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("app/src/main/java/com/jeevesh415/blutoothconnector/MainActivity.java").read_text()
          assert "scroll.addView(root, new android.widget.ScrollView.LayoutParams(" in source, (
              "Launcher UI content must be attached as the ScrollView's direct child."
          )
          assert "setContentView(shell);" in source, "Launcher shell must be installed as the Activity content view."
          print("Launcher UI attachment check passed.")
          PY

      - name: Build debug APK for the current commit
        env:
          ANDROID_VERSION_NAME: 0.8.0-debug+${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Prepare and verify debug test artifact
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk blutooth-connector-debug.apk
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging blutooth-connector-debug.apk)"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.jeevesh415.blutoothconnector'"
          printf '%s\n' "$BADGING" | grep -q "sdkVersion:'29'"
          printf '%s\n' "$BADGING" | grep -q "versionName='0.8.0-debug+${GITHUB_RUN_NUMBER}'"
          sha256sum blutooth-connector-debug.apk | tee blutooth-connector-debug.apk.sha256
          cat > blutooth-connector-build-info.txt <<EOF
          commit=${GITHUB_SHA}
          workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          version_name=0.8.0-debug+${GITHUB_RUN_NUMBER}
          package=com.jeevesh415.blutoothconnector
          signing=debug
          warning=Test artifact only. It is not signed with the persistent release key and may not update an installed APK.
          EOF

      - name: Upload debug test artifact
        uses: actions/upload-artifact@v7
        with:
          name: blutooth-connector-debug-${{ github.run_number }}
          path: |
            blutooth-connector-debug.apk
            blutooth-connector-debug.apk.sha256
            blutooth-connector-build-info.txt
          if-no-files-found: error
          retention-days: 30


      - name: Check release signing secrets
        id: signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_B64" ]] || missing+=("ANDROID_KEYSTORE_B64")
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release publication skipped; configure repository Actions secrets: ${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release signing key
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER)) \
          ANDROID_VERSION_NAME="0.8.0+${GITHUB_RUN_NUMBER}" \
          gradle --no-daemon assembleRelease

      - name: Prepare release APK
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk blutooth-connector.apk
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging blutooth-connector.apk)"
          printf '%s\n' "$BADGING" | grep -q "package: name='com.jeevesh415.blutoothconnector'"
          printf '%s\n' "$BADGING" | grep -q "sdkVersion:'29'"
          printf '%s\n' "$BADGING" | grep -q "targetSdkVersion:'36'"
          EXPECTED_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          printf '%s\n' "$BADGING" | grep -q "versionCode='${EXPECTED_VERSION_CODE}'"
          sha256sum blutooth-connector.apk | tee blutooth-connector.apk.sha256

      - name: Verify signing certificate continuity
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          NEW_CERT="$("$APK_SIGNER" verify --print-certs blutooth-connector.apk \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print tolower($2); exit }')"
          test -n "$NEW_CERT"

          if gh release view latest >/dev/null 2>&1; then
            ASSET_NAMES="$(gh release view latest --json assets --jq '.assets[].name')"
            if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "blutooth-connector.apk"; then
              rm -rf /tmp/previous-signed-release
              mkdir -p /tmp/previous-signed-release
              gh release download latest --pattern "blutooth-connector.apk" \
                --dir /tmp/previous-signed-release
              OLD_APK="/tmp/previous-signed-release/blutooth-connector.apk"
              OLD_CERT="$("$APK_SIGNER" verify --print-certs "$OLD_APK" \
                | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print tolower($2); exit }')"
              if [[ -z "$OLD_CERT" || "$OLD_CERT" != "$NEW_CERT" ]]; then
                echo "::error::Release signing certificate changed. Refusing to replace the published APK because installed users would lose in-place updates."
                exit 1
              fi
            fi
          fi

      - name: Publish and verify signed APK
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$CURRENT_MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping stale release run; main advanced to $CURRENT_MAIN_SHA"
            exit 0
          fi
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest blutooth-connector.apk blutooth-connector.apk.sha256 --clobber
          else
            gh release create latest blutooth-connector.apk blutooth-connector.apk.sha256 \
              --target "${GITHUB_SHA}" \
              --title "Latest Android APK" \
              --notes "Automatically built from main. Persistently signed release APK for Android 10+. SHA-256 is provided as a companion asset."
          fi

          rm -rf /tmp/apk-verify
          mkdir -p /tmp/apk-verify
          gh release download latest --pattern "blutooth-connector.apk" --dir /tmp/apk-verify
          test -s /tmp/apk-verify/blutooth-connector.apk
          cmp blutooth-connector.apk /tmp/apk-verify/blutooth-connector.apk

          # Only move the floating latest tag after the exact uploaded bytes
          # have been downloaded and verified.
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.id')"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f target_commitish="${GITHUB_SHA}"
          fi

          # Remove the legacy ephemeral-debug assets only after the signed
          # replacement has been verified, so users cannot pick the wrong APK.
          ASSET_NAMES="$(gh release view latest --json assets --jq '.assets[].name')"
          for legacy_asset in blutooth-connector-debug.apk blutooth-connector-debug.apk.sha256; do
            if printf '%s\n' "$ASSET_NAMES" | grep -Fxq "$legacy_asset"; then
              gh release delete-asset latest "$legacy_asset" --yes
            fi
          done

      - name: Upload CI artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: blutooth-connector-apk
          path: |
            blutooth-connector.apk
            blutooth-connector.apk.sha256
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
