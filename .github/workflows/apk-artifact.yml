name: Android APK Release

concurrency:
  group: android-apk-release
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install stable Android SDK 36
        run: sdkmanager --channel=1 "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk blutooth-connector-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging blutooth-connector-debug.apk | grep -q "sdkVersion:'29'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging blutooth-connector-debug.apk | grep -q "targetSdkVersion:'36'"
          sha256sum blutooth-connector-debug.apk | tee blutooth-connector-debug.apk.sha256

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest blutooth-connector-debug.apk blutooth-connector-debug.apk.sha256 --clobber
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true
            RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.id')"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -f target_commitish="${GITHUB_SHA}"
          else
            gh release create latest blutooth-connector-debug.apk blutooth-connector-debug.apk.sha256               --target "${GITHUB_SHA}"               --title "Latest Android APK"               --notes "Automatically built from main. Android 10+ APK. SHA-256 is provided as a companion asset."
          fi

          rm -rf /tmp/apk-verify
          mkdir -p /tmp/apk-verify
          gh release download latest --pattern "blutooth-connector-debug.apk" --dir /tmp/apk-verify
          test -s /tmp/apk-verify/blutooth-connector-debug.apk
          cmp blutooth-connector-debug.apk /tmp/apk-verify/blutooth-connector-debug.apk

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: blutooth-connector-apk
          path: |
            blutooth-connector-debug.apk
            blutooth-connector-debug.apk.sha256
          retention-days: 30
